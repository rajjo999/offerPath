name: OfferPath
options:
  bundleIdPrefix: com.yourname
  deploymentTarget:
    iOS: "17.0"

targets:
  OfferPath:
    type: application
    platform: iOS
    sources:
      - OfferPath
      - App
      - Core
      - Features
      - Models
      - Resources
      - Services
    settings:
      INFOPLIST_FILE: OfferPath/App/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.yourname.offerpath
      SWIFT_VERSION: "5.0"
      CLANG_ENABLE_MODULES: YES
      ENABLE_BITCODE: NO
      CODE_SIGN_IDENTITY: "Apple Development"
      CODE_SIGNING_REQUIRED: false
      CODE_SIGNING_ALLOWED: false
      DEVELOPMENT_TEAM: ""
      ONLY_ACTIVE_ARCH: NO
      VALID_ARCHS: "arm64 x86_64"